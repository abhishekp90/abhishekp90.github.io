<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Modern Tic Tac Toe</title>
<style>
  :root {
    --x-color: #ff595e;
    --o-color: #1982c4;
    --bg-color: #0f0f10;
    --cell-bg: #1a1a1d;
    --glow: rgba(255, 255, 255, 0.1);
  }

  body {
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at center, #202225, #0f0f10);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }

  h1 {
    margin-bottom: 20px;
    letter-spacing: 2px;
    font-size: 2.2em;
    text-transform: uppercase;
    background: linear-gradient(90deg, #ff595e, #1982c4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 110px);
    grid-template-rows: repeat(3, 110px);
    gap: 12px;
    margin: 15px 0;
  }

  .cell {
    background: var(--cell-bg);
    border-radius: 15px;
    font-size: 2.5em;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease-in-out;
    box-shadow: 0 0 15px var(--glow);
  }

  .cell:hover:not(.taken) {
    background: linear-gradient(135deg, #292b2f, #1c1c1f);
    transform: scale(1.05);
    box-shadow: 0 0 25px var(--glow);
  }

  .cell.taken {
    cursor: not-allowed;
  }

  .cell.x {
    color: var(--x-color);
    text-shadow: 0 0 10px var(--x-color);
  }

  .cell.o {
    color: var(--o-color);
    text-shadow: 0 0 10px var(--o-color);
  }

  #status {
    margin-top: 10px;
    font-size: 1.3em;
    text-shadow: 0 0 5px #fff;
  }

  button {
    margin-top: 25px;
    padding: 12px 30px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(90deg, #ff595e, #1982c4);
    color: white;
    font-size: 1em;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.25s ease;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
  }

  button:hover {
    transform: scale(1.1);
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
  }

  @media (max-width: 500px) {
    .board {
      grid-template-columns: repeat(3, 90px);
      grid-template-rows: repeat(3, 90px);
      gap: 10px;
    }
    .cell {
      font-size: 2em;
    }
  }
</style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div class="board" id="board"></div>
  <div id="status">Player X's turn</div>
  <button id="reset">Restart</button>

<script>
  const board = document.getElementById('board');
  const statusText = document.getElementById('status');
  const resetBtn = document.getElementById('reset');

  let currentPlayer = 'X';
  let gameActive = true;
  let boardState = Array(9).fill('');

  const winningCombos = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  // Create cells
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('div');
    cell.classList.add('cell');
    cell.dataset.index = i;
    cell.addEventListener('click', handleClick);
    board.appendChild(cell);
  }

  function handleClick(e) {
    const index = e.target.dataset.index;
    if (!gameActive || boardState[index]) return;

    boardState[index] = currentPlayer;
    e.target.textContent = currentPlayer;
    e.target.classList.add('taken', currentPlayer.toLowerCase());

    if (checkWinner()) {
      statusText.textContent = `🎉 Player ${currentPlayer} Wins!`;
      gameActive = false;
      glowWinner();
      return;
    }

    if (!boardState.includes('')) {
      statusText.textContent = `It's a draw 🤝`;
      gameActive = false;
      return;
    }

    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    statusText.textContent = `Player ${currentPlayer}'s turn`;
  }

  function checkWinner() {
    return winningCombos.some(combo => {
      const [a, b, c] = combo;
      return (
        boardState[a] &&
        boardState[a] === boardState[b] &&
        boardState[a] === boardState[c]
      );
    });
  }

  function glowWinner() {
    winningCombos.forEach(combo => {
      const [a,b,c] = combo;
      if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
        document.querySelectorAll('.cell')[a].style.boxShadow = '0 0 25px #fff';
        document.querySelectorAll('.cell')[b].style.boxShadow = '0 0 25px #fff';
        document.querySelectorAll('.cell')[c].style.boxShadow = '0 0 25px #fff';
      }
    });
  }

  resetBtn.addEventListener('click', () => {
    boardState.fill('');
    gameActive = true;
    currentPlayer = 'X';
    statusText.textContent = "Player X's turn";
    document.querySelectorAll('.cell').forEach(cell => {
      cell.textContent = '';
      cell.className = 'cell';
      cell.style.boxShadow = '0 0 15px var(--glow)';
    });
  });
</script>
</body>
</html>
